services:
  mlflow:
    container_name: daas-mlflow
    image: daas-mlflow
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}"
      MLFLOW_S3_IGNORE_TLS: "${MLFLOW_S3_IGNORE_TLS:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-dp_minio_user}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-supersecret}"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER_MLFLOW:-mlflow_pg_user}:${POSTGRES_PASSWORD_MLFLOW:-supersecret}@postgres_mlflow/${POSTGRES_DB_MLFLOW:-mlflow_db}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/}"
      MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-s3://mlflow/}"
    entrypoint: mlflow server -h 0.0.0.0
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres_mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/2.0/mlflow/experiments/search?max_results=1')",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: "unless-stopped"
    networks:
      - dagster_network

  minio:
    container_name: daas-minio
    image: minio/minio@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-dp_minio_user}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-supersecret}"
    volumes:
      - "minio:/data/minio"
    command: 'minio server /data/minio --console-address ":8900"'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "unless-stopped"
    networks:
      - dagster_network

  createbuckets:
    container_name: daas-createbuckets
    image: minio/mc@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-dp_minio_user}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-supersecret}"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/mlflow --ignore-existing;
      mc anonymous set download myminio/mlflow;
      mc mb myminio/raw --ignore-existing;
      mc anonymous set download myminio/raw;
      mc mb myminio/bronze --ignore-existing;
      mc anonymous set download myminio/bronze;
      mc mb myminio/silver --ignore-existing;
      mc anonymous set download myminio/silver;
      mc mb myminio/gold --ignore-existing;
      mc anonymous set download myminio/gold;
      exit 0;
      "
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dagster_network

  postgres_mlflow:
    container_name: daas-postgres-mlflow
    image: daas-postgres-mlflow
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER_MLFLOW:-mlflow_pg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_MLFLOW:-supersecret}
      POSTGRES_DB: ${POSTGRES_DB_MLFLOW:-mlflow_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_mlflow:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "unless-stopped"
    networks:
      - dagster_network

  postgres_dagster:
    container_name: daas-postgres-dagster
    image: daas-postgres-dagster
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster_pg_user}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-supersecret}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dagster:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "unless-stopped"
    networks:
      - dagster_network

  # This service runs the gRPC server that loads your user code, in both dagster-webserver
  # and dagster-daemon. By setting DAGSTER_CURRENT_IMAGE to its own image, we tell the
  # run launcher to use this same image when launching runs in a new container as well.
  # Multiple containers like this can be deployed separately - each just needs to run on
  # its own port, and have its own entry in the workspace.yaml file that's loaded by the
  # webserver.
  dagster_user_code:
    container_name: daas-dagster-user-code
    image: daas-dagster-user-code-image
    build:
      context: .
      dockerfile: Dockerfile.dagsterusercode
    restart: always
    environment:
      DAGSTER_POSTGRES_USER: "${DAGSTER_POSTGRES_USER:-dagster_pg_user}"
      DAGSTER_POSTGRES_PASSWORD: "${DAGSTER_POSTGRES_PASSWORD:-supersecret}"
      DAGSTER_POSTGRES_DB: "${DAGSTER_POSTGRES_DB:-dagster_db}"
      DAGSTER_CURRENT_IMAGE: "daas-dagster-user-code-image"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL:-http://minio:9000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-dp_minio_user}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-supersecret}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      MLFLOW_TRACKING_URI: "${MLFLOW_URL:-http://mlflow:5001}"
      HTTP_API_TOKEN: "${HTTP_API_TOKEN:-}"
    networks:
      - dagster_network

  # This service runs dagster-webserver, which loads your user code from the user code container.
  # Since our instance uses the QueuedRunCoordinator, any runs submitted from the webserver will be put on
  # a queue and later dequeued and launched by dagster-daemon.
  dagster_webserver:
    container_name: daas-dagster-webserver
    image: daas-dagster-webserver-image
    build:
      context: .
      dockerfile: Dockerfile.dagster
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      DAGSTER_POSTGRES_USER: "${DAGSTER_POSTGRES_USER:-dagster_pg_user}"
      DAGSTER_POSTGRES_PASSWORD: "${DAGSTER_POSTGRES_PASSWORD:-supersecret}"
      DAGSTER_POSTGRES_DB: "${DAGSTER_POSTGRES_DB:-dagster_db}"
    volumes:
      # Make docker client accessible so we can terminate containers from the webserver
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - dagster_network
    depends_on:
      postgres_dagster:
        condition: service_healthy
      dagster_user_code:
        condition: service_healthy

  # This service runs the dagster-daemon process, which is responsible for taking runs
  # off of the queue and launching them, as well as creating runs from schedules or sensors.
  dagster_daemon:
    container_name: daas-dagster-daemon
    image: daas-dagster-daemon-image
    build:
      context: .
      dockerfile: Dockerfile.dagster
    entrypoint:
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_POSTGRES_USER: "${DAGSTER_POSTGRES_USER:-dagster_pg_user}"
      DAGSTER_POSTGRES_PASSWORD: "${DAGSTER_POSTGRES_PASSWORD:-supersecret}"
      DAGSTER_POSTGRES_DB: "${DAGSTER_POSTGRES_DB:-dagster_db}"
    volumes:
      # Make docker client accessible so we can launch containers using host docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - dagster_network
    depends_on:
      postgres_dagster:
        condition: service_healthy
      dagster_user_code:
        condition: service_started

networks:
  dagster_network:
    driver: bridge
    name: dagster_network

volumes:
  pgdata_mlflow:
    driver: local
  pgdata_dagster:
    driver: local
  minio:
    driver: local
